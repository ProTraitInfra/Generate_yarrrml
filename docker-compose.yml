services:
  postgres:
    image: postgres:latest
    container_name: mock-staging-db
    environment:
      POSTGRES_USER: protraituser
      POSTGRES_PASSWORD: protraitpassword
      POSTGRES_DB: protraitdb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: